apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-api-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DanielNino997/mlops-taller-argocd.git
    targetRevision: main
    path: manifests/api
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
